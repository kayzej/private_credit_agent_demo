[project]
name = "private-credit-agent-demo"
version = "0.1.0"
description = "Private credit agent demo: document ingestion, extraction, deterministic credit engine, and LLM agents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.13",
    "mypy>=1.14",
    "pytest>=8.3",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "ingest",
    "parsing",
    "extract",
    "engine",
    "agents",
    "mcp/mcp_server",
    "vendor_mock",
    "evals",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.ruff.lint.isort]
known-first-party = [
    "ingest",
    "parsing",
    "extract",
    "engine",
    "agents",
    "mcp_server",
    "vendor_mock",
    "evals",
]

[tool.mypy]
python_version = "3.12"
mypy_path = "mcp"
packages = [
    "ingest",
    "parsing",
    "extract",
    "engine",
    "agents",
    "mcp_server",
    "vendor_mock",
    "evals",
]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = [
    "ingest",
    "parsing",
    "extract",
    "engine",
    "agents",
    "mcp",
    "vendor_mock",
    "evals",
]
addopts = "-ra"
